[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "visualastro"
dynamic = ["version"]
description = "Astro data analysis and plotting package"
authors = [
    {name = "Elko Gerville-Reache", email = "elkogerville@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.txt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "astropy",
    "matplotlib",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
images = [
    "regions",
    "reproject",
]
spectra = [
    "specutils",
    "dust_extinction",
]
spectralcube = [
    "spectral_cube",
    "visualastro[images]",
]
styles = [
    "scienceplots",
]
utils = [
    "cmasher",
    "colorspacious",
    "tol-colors",
    "tqdm",
]
all = [
    "visualastro[images,spectra,spectralcube,styles,utils]",
]

docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-design",
    "sphinx-copybutton",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
dev = [
    "visualastro[all,docs,test]",
]


[project.urls]
Homepage = "https://github.com/elkogerville/VisualAstro"
Documentation = "https://visualastro.readthedocs.io"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["visualastro*"]
exclude = [
    "visualastro.data",
    "visualastro.data.*",
    "visualastro.stylelib",
    "visualastro.stylelib.*",
]

[tool.setuptools_scm]
