[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "visualastro"
dynamic = ["version"]
description = "Astro data analysis and plotting package"
authors = [
    {name = "Elko Gerville-Reache", email = "elkogerville@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = [
    "LICENSE",
    "THIRD_PARTY_LICENSES.txt",
    "src/visualastro/stylelib/fontlib/**/LICENSE*",
    "src/visualastro/stylelib/fontlib/**/OFL*",
    "src/visualastro/stylelib/fontlib/**/*License*",
    "src/visualastro/stylelib/fontlib/**/AUTHORS*",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "astropy",
    "matplotlib",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
images = [
    "regions",
    "reproject",
]
spectra = [
    "specutils",
    "dust_extinction",
]
spectralcube = [
    "spectral_cube",
    "visualastro[images]",
]
styles = [
    "scienceplots",
]
utils = [
    "cmasher",
    "colorspacious",
    "tol-colors",
    "tqdm",
]
all = [
    "visualastro[images,spectra,spectralcube,styles,utils]",
]

test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-doctestplus",
]
docs = [
    "sphinx",
    "pydata_sphinx_theme",
    "sphinx-design",
    "sphinx-copybutton",
    "pytest-doctestplus",
    "visualastro[all]",
]
dev = [
    "visualastro[docs,test]",
]

[tool.pytest.ini_options]
testpaths = ["tests", "docs"]
doctest_plus = "enabled"
doctest_rst = "enabled"
text_file_format = "rst"
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE", "FLOAT_CMP"]
norecursedirs = ["docs/_build", "docs/_static", "build", "*.egg-info"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403"]

[project.urls]
Homepage = "https://github.com/elkogerville/VisualAstro"
Documentation = "https://visualastro.readthedocs.io"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["visualastro*"]
namespaces = true

[tool.setuptools.package-data]
"visualastro.stylelib" = [
    "**/*.mplstyle", "**/*.otf", "**/*.ttf",
    "fontlib/**/LICENSE*", "fontlib/**/OFL*",
    "fontlib/**/*License*", "fontlib/**/AUTHORS*", "fontlib/**/README*",
]
"visualastro.data" = ["*.fits", "*.png"]

[tool.setuptools_scm]
