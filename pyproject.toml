[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visualastro"
version = "0.2.1"
description = "Astro data analysis and plotting package"
authors = [
    {name = "Elko Gerville-Reache", email = "elkogerville@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "astropy",
    "cmasher",
    "matplotlib",
    "numpy",
    "reproject",
    "scipy",
    "tol-colors",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
images = [
    "regions",
]
spectralcube = [
    "spectral_cube",
    "regions",
]
spectra = [
    "specutils",
    "dust_extinction",
]
styles = [
    "scienceplots",
]
utils = [
    "colorspacious",
]
all = [
    "colorspacious",
    "dust_extinction",
    "regions",
    "scienceplots",
    "spectral_cube",
    "specutils",
]

[project.urls]
Homepage = "https://github.com/elkogerville/VisualAstro"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"visualastro" = [
    "stylelib/*.mplstyle",
    "stylelib/fontlib/**/*.ttf",
    "stylelib/fontlib/**/LICENSE",
    "data/*.png",
    "data/*.jpg",
    "*.md",
    "LICENSE"
]

[tool.setuptools.exclude-package-data]
"*" = [
    "*.egg-info/*",
    "*.egg-info",
    "EGG-INFO/*",
]

exclude = [
    "Tests*",
    "build*",
    "dist*",
    "*egg-info*",
    "*.egg-info",
    "EGG-INFO*",
    "src/visualastro/dev/*"
]
